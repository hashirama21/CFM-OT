# Optimized profile (Kaggle 2xT4): fp16, AdamW+cosine, EMA, compile, TF32.
num_epochs: 50
batch_size: 16
lr: 2e-4
checkpoint_dir: outputs/run_motfm/motfm_checkpoints
accelerator: gpu
devices: auto
strategy: auto
precision: 16-mixed
matmul_precision: high
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 4
gradient_accumulation_steps: 2
grad_clip_norm: 1.0
val_freq: 2
limit_val_batches: 0.25
num_val_samples: 8
optimizer: adamw
scheduler: cosine
weight_decay: 0.0
warmup_steps: null
min_lr_ratio: 0.05
use_compile: true
use_ema: true
ema_decay: 0.999
log_every_n_steps: 50
num_sanity_val_steps: 0
