[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motfm"
version = "0.1.0"
description = "Medical Optimal Transport Flow Matching for medical image synthesis."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
# Version floors (not exact pins) so the package installs across managed
# environments (Kaggle py3.10/3.11, Colab py3.13, HPC modules) and reuses the
# torch/numpy already provided by the platform instead of reinstalling them.
dependencies = [
    "flow_matching>=1.0.10",
    "hydra-core>=1.3,<1.4",
    "matplotlib",
    "monai_generative>=0.2.3",
    "numpy>=1.26",
    "omegaconf>=2.3,<2.4",
    "pandas",
    "PyYAML>=6.0",
    "pytorch-lightning>=2.2",
    "tensorboard",
    "torch>=2.2",
    "tqdm>=4.60",
]

[project.scripts]
motfm-train = "trainer:main"
motfm-infer = "inferer:main"

[project.urls]
Homepage = "https://github.com/milad1378yz/MOTFM"
Repository = "https://github.com/milad1378yz/MOTFM"
Paper = "https://arxiv.org/abs/2503.00266"

[tool.setuptools]
py-modules = ["trainer", "inferer"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*"]
namespaces = true

[tool.black]
line-length = 100
